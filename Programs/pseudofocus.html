<html>
    <head>
        <style>
            input:focus {
                background-color:coral;
                border: 2px blue;
            }
            </style>
    </head>
    <body>
        <h2>Click the box to see the :focus effect</h2>
        <input type="text"placeholder="I change color when focused!">
    </body>
</html>
